<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" rx="36" fill="#1e1e3f"/>

  <!-- Orchestra staff lines (top decoration) -->
  <g opacity="0.35">
    <rect x="36" y="40"  width="184" height="2" fill="#4fc1ff"/>
    <rect x="36" y="50"  width="184" height="2" fill="#4fc1ff"/>
    <rect x="36" y="60"  width="184" height="2" fill="#4fc1ff"/>
    <rect x="36" y="70"  width="184" height="2" fill="#4fc1ff"/>
    <rect x="36" y="80"  width="184" height="2" fill="#4fc1ff"/>
  </g>

  <!-- Two-line title -->
  <text x="128" y="148" font-family="-apple-system, Segoe UI, system-ui, sans-serif"
        font-size="38" font-weight="800" fill="#4fc1ff"
        text-anchor="middle" letter-spacing="-1">MiMonster</text>
  <text x="128" y="186" font-family="-apple-system, Segoe UI, system-ui, sans-serif"
        font-size="26" font-weight="500" fill="#d4d4d4"
        text-anchor="middle" letter-spacing="3">ORCHESTRA</text>

  <!-- Four agent dots: architect / coder / reviewer / security -->
  <circle cx="92"  cy="222" r="7" fill="#4ec9b0"/>
  <circle cx="116" cy="222" r="7" fill="#ce9178"/>
  <circle cx="140" cy="222" r="7" fill="#4fc1ff"/>
  <circle cx="164" cy="222" r="7" fill="#dcdcaa"/>
</svg>
